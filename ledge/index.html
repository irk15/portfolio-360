<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledge at Golden Hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,500;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed WebGL illustration; a comic caption box floats bottom-left, a hint top-right. Single look, by choice. */
:root{
  --ink:#1c1512;
  --caption:#f2d68a;
  --caption-deep:#e0b85c;
  --paper:#fbf1da;
  --accent:#1f6470;
  --muted:#5c4636;
  --f-letter:"Shantell Sans","Comic Sans MS","Chalkboard SE",ui-rounded,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:#1c1512;color:var(--ink);font-family:var(--f-letter)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.panel{
  position:fixed;
  left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:min(360px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  background:var(--caption);
  border:2.5px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  padding:14px 16px 14px;
  display:grid;gap:10px;
  transform:translateY(0);opacity:1;
  transition:opacity .6s ease, transform .6s ease;
}
.panel.pre{opacity:0;transform:translateY(14px)}
.eyebrow{margin:0;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:800;font-size:clamp(22px,4.6vw,28px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.readout{display:flex;align-items:baseline;gap:10px;margin:0}
.clock{font:600 26px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase{font-style:italic;font-weight:500;font-size:16px;color:var(--muted)}
.slider{position:relative;padding-bottom:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border:2px solid var(--ink);border-radius:999px;background:linear-gradient(90deg,#f7e2ad 0%,#f0a35e 45%,#b8667e 72%,#232a55 100%)}
input[type=range]::-moz-range-track{height:8px;border:2px solid var(--ink);border-radius:999px;background:linear-gradient(90deg,#f7e2ad 0%,#f0a35e 45%,#b8667e 72%,#232a55 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]:focus-visible{outline:2.5px dashed var(--ink);outline-offset:3px}
.ticks{position:absolute;left:11px;right:11px;bottom:0;height:14px;font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{
  font:800 14px/1 var(--f-letter);color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  padding:9px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:transform .08s ease, box-shadow .08s ease, background .15s;
}
button:hover{background:#fff8e8}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:2.5px dashed var(--ink);outline-offset:3px}
button[aria-pressed=true]{background:var(--accent);color:var(--paper)}
button svg{width:14px;height:14px;flex:none}
.hint{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);
  right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));
  margin:0;max-width:min(300px,calc(100% - 32px));
  font:500 13px/1.35 var(--f-letter);color:var(--paper);
  background:rgba(28,21,18,.72);border:1.5px solid rgba(251,241,218,.35);
  padding:8px 11px;transition:opacity .8s ease;
}
.hint.gone{opacity:0;pointer-events:none}
.bubble{
  position:fixed;left:0;top:0;pointer-events:none;
  font:800 17px/1.15 var(--f-letter);color:var(--ink);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;
  padding:8px 13px;white-space:nowrap;
  transform-origin:20% 100%;
  animation:pop .28s cubic-bezier(.3,1.6,.5,1);
}
.bubble::after{
  content:"";position:absolute;left:18px;bottom:-12px;width:14px;height:14px;
  background:var(--paper);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);
  transform:skewX(25deg) rotate(45deg);
}
@keyframes pop{from{transform:var(--pos) scale(.4);opacity:0}to{transform:var(--pos) scale(1);opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.err{position:fixed;inset:0;display:grid;place-items:center;color:var(--paper);font:500 16px/1.4 var(--f-letter);padding:24px;text-align:center}
@media (max-width:520px){
  .panel{padding:12px 13px;gap:8px}
  .clock{font-size:22px}
  .hint{font-size:12px}
  .eyebrow{display:none}
}
@media (prefers-reduced-motion:reduce){.panel,.bubble{transition:none;animation:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="Interactive illustration: a masked hero in a teal hooded suit and mustard scarf sits on a brick rooftop ledge beside a stray cat, overlooking water towers and a sunlit city."></canvas>

<p class="hint" id="hint">Drag to look around. Scroll or pinch to zoom. Tap the hero, the cat, or the sky.</p>

<section class="panel pre" id="panel" aria-label="Scene controls">
  <p class="eyebrow">Rooftop, 23rd floor</p>
  <h1>Ledge at Golden Hour</h1>
  <p class="readout"><span class="clock" id="clock">18:40</span><span class="phase" id="phase">Golden hour</span></p>
  <div class="slider">
    <label for="tod" class="sr">Time of day</label>
    <input id="tod" type="range" min="0" max="1000" value="450">
    <div class="ticks" aria-hidden="true">
      <span style="left:0%">Morning</span><span style="left:45%">Golden</span><span style="left:72%">Dusk</span><span style="left:100%">Night</span>
    </div>
  </div>
  <div class="row">
    <button id="play" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="playIcon" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span id="playLabel">Play the day</span></button>
    <button id="ink" aria-pressed="true"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12 L9 5 M8 3l3 3M10 1.5l2.5 2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Ink lines</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p class="err">The 3D engine did not load. Check your connection and reload.</p>');return;}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- seeded random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=mulberry32(23);
const rnd=(a,b)=>a+(b-a)*R();
const pick=arr=>arr[Math.floor(R()*arr.length)];

/* ---------- renderer ---------- */
const canvas=document.getElementById('c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'}); }
catch(e){document.body.insertAdjacentHTML('beforeend','<p class="err">This illustration needs WebGL, which this browser has turned off.</p>');return;}
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.1,2400);
scene.fog=new THREE.FogExp2(0xe8b48e,0.0030);

/* ---------- toon helpers ---------- */
const gradMap=new THREE.DataTexture(new Uint8Array([95,95,95,255, 168,168,168,255, 255,255,255,255]),3,1,THREE.RGBAFormat);
gradMap.minFilter=gradMap.magFilter=THREE.NearestFilter;gradMap.generateMipmaps=false;gradMap.needsUpdate=true;
const toon=(color,o={})=>new THREE.MeshToonMaterial(Object.assign({color,gradientMap:gradMap},o));
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function canvasTex(w,h,draw,repeat=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  t.anisotropy=maxAniso;return t;
}

/* ---------- geometry merger (keeps draw calls low) ---------- */
class Merger{
  constructor(){this.p=[];this.n=[];this.u=[];this.c=[];}
  add(geo,matrix,color,roofTint){
    const g=(geo.index?geo.toNonIndexed():geo.clone());g.applyMatrix4(matrix);
    const P=g.attributes.position.array,N=g.attributes.normal.array,U=g.attributes.uv?g.attributes.uv.array:null;
    const col=new THREE.Color(color);
    for(let i=0;i<P.length/3;i++){
      this.p.push(P[i*3],P[i*3+1],P[i*3+2]);this.n.push(N[i*3],N[i*3+1],N[i*3+2]);
      this.u.push(U?U[i*2]:0,U?U[i*2+1]:0);
      const k=(roofTint&&N[i*3+1]>0.5)?roofTint:1;
      this.c.push(col.r*k,col.g*k,col.b*k);
    }
    g.dispose();
  }
  build(mat){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
    const m=new THREE.Mesh(g,mat);m.castShadow=m.receiveShadow=true;return m;
  }
}
const M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),S3=new THREE.Vector3(),P3=new THREE.Vector3(),E=new THREE.Euler();
const mtx=(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1)=>M4.compose(P3.set(x,y,z),Q.setFromEuler(E.set(rx,ry,rz)),S3.set(sx,sy,sz)).clone();

/* ---------- facade textures ---------- */
const litWindowMats=[];
function facade(wall,{cols=4,rows=4,mx=.2,my=.22,gold=.35,litP=.45,frame='#2b1d17',bars=true,dark='#5d4a54'}={}){
  const S=256,cw=S/cols,ch=S/rows,lit=[];
  const map=canvasTex(S,S,(g)=>{
    g.fillStyle=wall;g.fillRect(0,0,S,S);
    for(let i=0;i<700;i++){g.fillStyle=`rgba(70,35,25,${rnd(0,.07)})`;g.fillRect(rnd(0,S),rnd(0,S),rnd(1,3),rnd(2,14));}
    g.strokeStyle='rgba(43,29,23,.28)';g.lineWidth=2;
    for(let r=0;r<rows;r++){const y=r*ch+ch*(1-my*.45);g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=c*cw+cw*mx,y=r*ch+ch*my,w=cw*(1-2*mx),h=ch*(1-2*my);
      const v=R();
      if(v<gold){const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,'#fbe3a8');gr.addColorStop(1,'#e59a5c');g.fillStyle=gr;}
      else if(v<gold+.25){g.fillStyle='#b48a7a';}
      else g.fillStyle=dark;
      g.fillRect(x,y,w,h);
      if(v>=gold&&R()<.5){g.fillStyle='rgba(240,200,150,.35)';g.fillRect(x,y+h*.55,w,h*.45);} // half-drawn blind
      g.strokeStyle=frame;g.lineWidth=2.5;g.strokeRect(x,y,w,h);
      if(bars){g.lineWidth=1.6;g.beginPath();g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+h);g.moveTo(x,y+h*.45);g.lineTo(x+w,y+h*.45);g.stroke();}
      g.fillStyle='rgba(255,240,220,.35)';g.fillRect(x-2,y+h+1,w+4,3);
      lit.push(R()<litP);
    }
  });
  const emi=canvasTex(S,S,(g)=>{
    g.fillStyle='#000';g.fillRect(0,0,S,S);let i=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      if(lit[i++]){const x=c*cw+cw*mx,y=r*ch+ch*my,w=cw*(1-2*mx),h=ch*(1-2*my);
        const k=rnd(.55,1);g.fillStyle=`rgb(${255*k|0},${200*k|0},${130*k|0})`;g.fillRect(x+2,y+2,w-4,h-4);}
    }
  });
  const mat=toon(0xffffff,{map,emissiveMap:emi,emissive:0x000000,vertexColors:true});
  litWindowMats.push(mat);
  return {mat,tileW:cols*1.55,tileH:rows*1.75};
}
const brickTex=canvasTex(256,256,(g,W,H)=>{
  g.fillStyle='#94523d';g.fillRect(0,0,W,H);
  const bh=16,bw=44;
  for(let y=0;y<H;y+=bh){const off=((y/bh)%2)*bw/2;
    for(let x=-bw;x<W+bw;x+=bw){
      const t=R();g.fillStyle=t<.3?'#a35e43':t<.6?'#874834':t<.85?'#99573f':'#7a3e2d';
      g.fillRect(x+off+1.5,y+1.5,bw-3,bh-3);
      g.fillStyle='rgba(255,210,160,.12)';g.fillRect(x+off+2,y+2,bw-5,2);
    }}
  g.strokeStyle='rgba(40,20,14,.55)';g.lineWidth=1.4;
  for(let y=0;y<=H;y+=bh){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke();}
  for(let i=0;i<500;i++){g.fillStyle=`rgba(30,15,10,${rnd(0,.12)})`;g.fillRect(rnd(0,W),rnd(0,H),rnd(1,3),rnd(1,8));}
});
const concreteTex=canvasTex(256,256,(g,W,H)=>{
  g.fillStyle='#b9a493';g.fillRect(0,0,W,H);
  for(let i=0;i<1500;i++){g.fillStyle=`rgba(${R()<.5?'60,40,30':'255,240,220'},${rnd(0,.08)})`;g.fillRect(rnd(0,W),rnd(0,H),rnd(1,4),rnd(1,4));}
  g.strokeStyle='rgba(40,25,18,.5)';g.lineWidth=2;
  for(let x=0;x<=W;x+=128){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke();}
  g.lineWidth=1;for(let i=0;i<6;i++){g.beginPath();let x=rnd(0,W),y=rnd(0,H);g.moveTo(x,y);for(let k=0;k<5;k++){x+=rnd(-14,14);y+=rnd(-4,14);g.lineTo(x,y);}g.stroke();}
});
const grilleTex=canvasTex(128,128,(g,W,H)=>{
  g.fillStyle='#c8c2b8';g.fillRect(0,0,W,H);
  g.fillStyle='#4a4440';for(let y=10;y<H-10;y+=7)g.fillRect(10,y,W-20,3.5);
  g.strokeStyle='#2a221d';g.lineWidth=3;g.strokeRect(6,6,W-12,H-12);
},false);

/* ---------- uv-scaled box ---------- */
function boxGeo(w,h,d,tileW,tileH,ox=0){
  const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;
  const faces=[[d,h],[d,h],null,null,[w,h],[w,h]];
  for(let f=0;f<6;f++){
    for(let v=0;v<4;v++){const i=f*4+v;
      if(!faces[f]){uv.setXY(i,.004,.996);continue;}
      const [fw,fh]=faces[f];
      uv.setXY(i,uv.getX(i)*fw/tileW+ox,(uv.getY(i)-1)*fh/tileH-.03);
    }}
  return g;
}

/* ======================================================
   CITY
   ====================================================== */
const BASE=-16;
const variants=[
  facade('#ead0b3',{gold:.4}),
  facade('#dca98a',{gold:.35,cols:3}),
  facade('#c98e6c',{gold:.3,dark:'#4e3c44'}),
  facade('#f0ddc6',{gold:.45,cols:5,rows:5}),
  facade('#aa6c50',{gold:.25,cols:3,rows:4,frame:'#24160f'}),
  facade('#cdb6a2',{gold:.38,bars:false}),
];
const vMergers=variants.map(()=>new Merger());
const clutter=new Merger();
const clutterMat=toon(0xffffff,{vertexColors:true});

function waterTower(x,y,z,s=1){
  const wood=pick(['#8c5a3a','#7a4e34','#9a6644']),dark='#3a2a24';
  const legH=3.2*s,tankR=1.5*s,tankH=2.8*s;
  for(const [dx,dz] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
    clutter.add(new THREE.BoxGeometry(.16*s,legH,.16*s),mtx(x+dx*tankR*.75,y+legH/2,z+dz*tankR*.75),dark);
  }
  // cross bracing
  for(const [ax,az,ry] of [[0,-1,0],[0,1,0],[-1,0,Math.PI/2],[1,0,Math.PI/2]]){
    for(const sgn of [1,-1]){
      clutter.add(new THREE.BoxGeometry(tankR*2.1,.07*s,.07*s),mtx(x+ax*tankR*.75,y+legH*.5,z+az*tankR*.75,0,ry,sgn*0.95),dark);
    }}
  clutter.add(new THREE.BoxGeometry(tankR*2.2,.18*s,tankR*2.2),mtx(x,y+legH,z),dark);
  clutter.add(new THREE.CylinderGeometry(tankR,tankR*1.03,tankH,14),mtx(x,y+legH+tankH/2+.09,z),wood);
  for(let i=0;i<3;i++)clutter.add(new THREE.CylinderGeometry(tankR*1.045,tankR*1.045,.09*s,14),mtx(x,y+legH+.4*s+i*tankH*.38,z),dark);
  clutter.add(new THREE.ConeGeometry(tankR*1.12,1.1*s,14),mtx(x,y+legH+tankH+.6*s,z),'#4a3a32');
  clutter.add(new THREE.SphereGeometry(.14*s,6,4),mtx(x,y+legH+tankH+1.2*s,z),dark);
}
function hvac(x,y,z){
  const w=rnd(1,2.6),h=rnd(.6,1.4),d=rnd(1,2);
  clutter.add(new THREE.BoxGeometry(w,h,d),mtx(x,y+h/2,z,0,rnd(-.2,.2),0),pick(['#bdb4a8','#9a9088','#c9bba8']));
  if(R()<.5)clutter.add(new THREE.CylinderGeometry(.12,.12,rnd(1,2.4),6),mtx(x+w*.3,y+h,z),'#6a5c52');
}
function building(cx,cz,w,d,top,vi){
  const h=top-BASE;const v=variants[vi];
  vMergers[vi].add(boxGeo(w,h,d,v.tileW,v.tileH,Math.floor(rnd(0,4))*.25),mtx(cx,BASE+h/2,cz),'#ffffff',.78);
  if(R()<.75){const ch=rnd(.35,.7);clutter.add(new THREE.BoxGeometry(w+.5,ch,d+.5),mtx(cx,top-ch/2+.05,cz),pick(['#e6cfb6','#cfae94','#b98a6c','#efe2d0']));}
  if(R()<.5){const pw=.25;clutter.add(new THREE.BoxGeometry(w,.9,pw),mtx(cx,top+.45,cz+d/2-pw/2),'#c7a98f');}
  const r=R();
  if(r<.42&&w>4.5)waterTower(cx+rnd(-w*.2,w*.2),top,cz+rnd(-d*.2,d*.2),rnd(.75,1.1));
  else if(r<.8){const n=1+Math.floor(R()*3);for(let i=0;i<n;i++)hvac(cx+rnd(-w*.35,w*.35),top,cz+rnd(-d*.35,d*.35));}
  if(R()<.25&&h>10){const sh=rnd(2,5),sw=w*rnd(.3,.5),sd=d*rnd(.3,.5);
    vMergers[vi].add(boxGeo(sw,sh,sd,v.tileW,v.tileH),mtx(cx+rnd(-w*.15,w*.15),top+sh/2,cz+rnd(-d*.15,d*.15)),'#ffffff',.78);}
}
const inGap=(x,z)=>z<-34&&x>-10&&x<4.5;
function band(z,x0,x1,hmin,hmax,jit=3){
  let x=x0;
  while(x<x1){
    const w=rnd(5,11),d=rnd(7,12),cx=x+w/2,cz=z+rnd(-jit,jit);
    let top=rnd(hmin,hmax);
    if(inGap(cx,cz))top=Math.min(top,BASE+rnd(4,8));
    if(cx>9&&cx<26&&cz<-38&&cz>-62){x+=w;continue;} // tall tower slot
    building(cx,cz,w,d,top,Math.floor(R()*variants.length));
    x+=w+rnd(.2,2.4);
  }
}
band(-16,-30,40,-5,-2.2,1.5);
band(-28,-34,46,-5,0);
band(-42,-40,54,-3,13);
band(-60,-48,64,0,22);
band(-82,-60,80,3,28,5);
band(-108,-80,100,6,32,6);
band(-140,-110,130,4,26,8);

const skyU={top:{value:new THREE.Color()},mid:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunCol:{value:new THREE.Color()},
  cloudLit:{value:new THREE.Color()},cloudShade:{value:new THREE.Color()},glowDir:{value:new THREE.Vector3(-.4,.05,-1).normalize()},
  time:{value:0},night:{value:0},moonDir:{value:new THREE.Vector3(.5,.45,-1).normalize()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,48,24),new THREE.ShaderMaterial({
  uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
  varying vec3 vDir;uniform vec3 top,mid,hor,sunCol,cloudLit,cloudShade,glowDir,moonDir;uniform float time,night;
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
  void main(){
    vec3 d=normalize(vDir);float h=d.y;
    vec3 c=mix(hor,mid,smoothstep(-.02,.16,h));c=mix(c,top,smoothstep(.16,.62,h));
    float g=max(dot(d,glowDir),0.);c+=sunCol*(pow(g,6.)*.28+pow(g,40.)*.25)*(1.-night);
    // streaky illustrated clouds, posterized into two tones
    vec2 p=d.xz/max(h+.08,.06);
    float n=fbm(vec2(p.x*.32+time*.004,p.y*1.6));
    float band=smoothstep(.02,.1,h)*(1.-smoothstep(.32,.62,h));
    float cl=smoothstep(.56,.6,n)*band;
    vec3 cc=mix(cloudShade,cloudLit,step(.64,n+ (d.x*.04)));
    c=mix(c,cc,cl*.92);
    // stars + moon
    vec2 sp=vec2(atan(d.z,d.x),asin(h))*320.;
    float st=step(.9975,h21(floor(sp)))*smoothstep(.06,.3,h)*(.6+.4*sin(time*2.+h21(floor(sp)+3.)*40.));
    c+=vec3(1.,.95,.85)*st*night*(1.-cl);
    float m=dot(d,moonDir);c+=vec3(1.,.96,.86)*(smoothstep(.99955,.9997,m)*1.1+pow(max(m,0.),300.)*.25)*night;
    gl_FragColor=vec4(c,1.);
  }`
}));

 {t:1,   name:'Night',       clock:22*60+24,el:38,az:.45, sun:'#9db0ff',sunI:.3,  hs:'#2e3866',hg:'#221f30',hI:.62, top:'#070b1e',mid:'#141d46',hor:'#2b3268',fog:'#1e2448',cl:'#3a4274',cs:'#1c2348',win:1.25,glow:'#7a86c8',night:1,dust:0,grade:'#e6ecff'},
];
const cA=new THREE.Color(),cB=new THREE.Color();
function lerpCol(a,b,t,out){return out.copy(cA.set(a)).lerp(cB.set(b),t);}
let tod=.45;
const state={night:0,dust:1,win:0,grade:new THREE.Color(1,1,1)};
function applyTime(t){
  let i=0;while(i<KEYS.length-2&&t>KEYS[i+1].t)i++;
  const A=KEYS[i],B=KEYS[i+1],k=THREE.MathUtils.clamp((t-A.t)/(B.t-A.t),0,1),s=k*k*(3-2*k);
  const L=(p)=>A[p]+(B[p]-A[p])*s;
  const el=THREE.MathUtils.degToRad(L('el')),az=L('az');
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)).normalize();
  sun.position.copy(sun.target.position).addScaledVector(dir,220);
  lerpCol(A.sun,B.sun,s,sun.color);sun.intensity=L('sunI');
  lerpCol(A.hs,B.hs,s,hemi.color);lerpCol(A.hg,B.hg,s,hemi.groundColor);hemi.intensity=L('hI');
  lerpCol(A.top,B.top,s,skyU.top.value);lerpCol(A.mid,B.mid,s,skyU.mid.value);lerpCol(A.hor,B.hor,s,skyU.hor.value);
  lerpCol(A.cl,B.cl,s,skyU.cloudLit.value);lerpCol(A.cs,B.cs,s,skyU.cloudShade.value);lerpCol(A.glow,B.glow,s,skyU.sunCol.value);
  lerpCol(A.fog,B.fog,s,scene.fog.color);
  lerpCol(A.grade,B.grade,s,state.grade);
  skyU.night.value=state.night=L('night');
  skyU.glowDir.value.set(-dir.x*.2-.35,.04,-1).normalize();
  state.win=L('win');state.dust=L('dust');
  const we=new THREE.Color(1,.74,.42).multiplyScalar(state.win);
  litWindowMats.forEach(m=>m.emissive.copy(we));
  glassMat.emissive.setRGB(.9,.6,.3).multiplyScalar(state.win*.55);
  HM.lens.emissiveIntensity=.25+state.night*1.1;
  CM.eye.emissiveIntensity=.35+state.night*1.4;
  waterMat.color.copy(skyU.hor.value).lerp(skyU.mid.value,.4).multiplyScalar(.95);
  dustMat.opacity=.8*state.dust;
  // clock
  const mins=Math.round(L('clock'));
  clockEl.textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  phaseEl.textContent=(s<.5?A:B).name;
  renderer.shadowMap.needsUpdate=true;
}

/* ======================================================
   POST: ink lines, hatching, paper grain
   ====================================================== */
let rtColor,rtNormal,W=1,H=1,DPR=1;
const normalMat=new THREE.MeshNormalMaterial();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postU={tColor:{value:null},tDepth:{value:null},tNormal:{value:null},res:{value:new THREE.Vector2()},px:{value:1},
  near:{value:camera.near},far:{value:camera.far},ink:{value:new THREE.Color(0x1f1612)},inkOn:{value:1},grade:{value:new THREE.Color(1,1,1)},night:{value:0},time:{value:0}};
const post=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:postU,depthTest:false,depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
  varying vec2 vUv;uniform sampler2D tColor,tDepth,tNormal;uniform vec2 res;uniform float px,near,far,inkOn,night,time;uniform vec3 ink,grade;
  float lin(float d){float z=d*2.-1.;return 2.*near*far/(far+near-z*(far-near));}
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  void main(){
    vec2 o=px/res;
    float dc=lin(texture2D(tDepth,vUv).r);
    vec3 nc=texture2D(tNormal,vUv).rgb*2.-1.;
    float de=0.,ne=0.;
    vec2 offs[4];offs[0]=vec2(o.x,0.);offs[1]=vec2(-o.x,0.);offs[2]=vec2(0.,o.y);offs[3]=vec2(0.,-o.y);
    for(int i=0;i<4;i++){
      float d=lin(texture2D(tDepth,vUv+offs[i]).r);
      de=max(de,(d-dc)/min(d,dc));
      vec3 n=texture2D(tNormal,vUv+offs[i]).rgb*2.-1.;
      ne=max(ne,1.-dot(nc,n));
    }
    float wob=h21(floor(gl_FragCoord.xy/(3.*px)))*.5+.75;
    float e=max(smoothstep(.025,.07,de),smoothstep(.18,.45,ne)*step(dc,far*.9));
    float fade=mix(1.,.28,smoothstep(14.,320.,dc));
    vec3 col=texture2D(tColor,vUv).rgb;
    float lum=dot(col,vec3(.299,.587,.114));
    // cross hatching inside shadows of nearby surfaces
    float hx=fract((gl_FragCoord.x-gl_FragCoord.y)/(5.5*px));
    float hy=fract((gl_FragCoord.x+gl_FragCoord.y)/(7.*px));
    float near1=(1.-smoothstep(10.,90.,dc))*step(dc,far*.9);
    float h1=step(.78,hx)*(1.-smoothstep(.2,.36,lum));
    float h2=step(.82,hy)*(1.-smoothstep(.1,.2,lum));
    col*=1.-(h1*.32+h2*.28)*near1*inkOn;
    // ink
    vec3 inkC=mix(ink,ink*0.4+vec3(.02,.03,.08),night);
    col=mix(col,inkC,clamp(e*fade*wob,0.,1.)*inkOn*.95);
    // grade + paper
    col*=grade;
    col=(col-.5)*1.05+.5;
    float g=h21(gl_FragCoord.xy/px+.13)-.5;
    float paper=h21(floor(gl_FragCoord.xy/(2.*px)))-.5;
    col+=g*.035+paper*.02;
    vec2 q=vUv-.5;col*=1.-dot(q,q)*.55;
    gl_FragColor=vec4(clamp(col,0.,1.),1.);
  }`}));
const postScene=new THREE.Scene();postScene.add(post);

function makeTargets(){
  if(rtColor){rtColor.dispose();rtColor.depthTexture.dispose();rtNormal.dispose();}
  const w=Math.floor(W*DPR),h=Math.floor(H*DPR);
  rtColor=new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  rtColor.depthTexture=new THREE.DepthTexture(w,h);rtColor.depthTexture.type=THREE.UnsignedIntType;
  rtNormal=new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
  postU.tColor.value=rtColor.texture;postU.tDepth.value=rtColor.depthTexture;postU.tNormal.value=rtNormal.texture;
  postU.res.value.set(w,h);postU.px.value=Math.max(1,DPR*.9);
}

/* ======================================================
   CAMERA + INTERACTION
   ====================================================== */
const camBase=new THREE.Vector3(1.0,.95,7.6);
const lookBase=new THREE.Vector3(1.8,3.2,-30);
let yaw=0,pitch=0,tYaw=0,tPitch=0,mx=0,my=0,smx=0,smy=0,zoom=0,tZoom=0,baseFov=50;
let intro=reduceMotion?1:0;
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  camera.aspect=W/H;
  baseFov=camera.aspect<.8?58:camera.aspect<1.3?50:40;
  camera.updateProjectionMatrix();makeTargets();
}
addEventListener('resize',resize);

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null,moved=0;const pointers=new Map();let pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}
  down={x:e.clientX,y:e.clientY,yaw:tYaw,pitch:tPitch};moved=0;canvas.classList.add('drag');hideHint();});
canvas.addEventListener('pointermove',e=>{
  mx=(e.clientX/W)*2-1;my=-(e.clientY/H)*2+1;
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);tZoom=THREE.MathUtils.clamp(tZoom-(d-pinch0)*.04,-14,10);pinch0=d;moved=99;return;}
  if(!down)return;
  const dx=e.clientX-down.x,dy=e.clientY-down.y;moved=Math.max(moved,Math.hypot(dx,dy));
  tYaw=THREE.MathUtils.clamp(down.yaw-dx*.0028,-.55,.55);
  tPitch=THREE.MathUtils.clamp(down.pitch+dy*.0022,-.22,.3);
});
function endPtr(e){pointers.delete(e.pointerId);canvas.classList.remove('drag');
  if(down&&moved<6&&pointers.size===0)tap(e.clientX,e.clientY);
  if(pointers.size===0)down=null;}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();tZoom=THREE.MathUtils.clamp(tZoom+e.deltaY*.012,-14,10);hideHint();},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  if(e.key==='ArrowLeft')tYaw=Math.min(.55,tYaw+.06);if(e.key==='ArrowRight')tYaw=Math.max(-.55,tYaw-.06);
  if(e.key==='ArrowUp')tPitch=Math.min(.3,tPitch+.04);if(e.key==='ArrowDown')tPitch=Math.max(-.22,tPitch-.04);
});

const hintEl=document.getElementById('hint');let hintT=0;
function hideHint(){if(!hintEl.classList.contains('gone'))setTimeout(()=>hintEl.classList.add('gone'),2500);}
setTimeout(()=>hintEl.classList.add('gone'),12000);

let heroLook=0,heroWave=0,catAlert=0,catSwish=0,birdsScatter=0;
const heroLines={Morning:['Quiet start.','Coffee first.'],'Golden hour':['Best view in the city.','Ten more minutes.'],Dusk:['Lights are coming on.','Almost time.'],Night:['Patrol starts now.','Stay close, cat.']};
let bubbleEl=null,bubbleObj=null,bubbleOff=new THREE.Vector3(),bubbleT=0;
function say(text,obj,off){
  if(bubbleEl)bubbleEl.remove();
  bubbleEl=document.createElement('div');bubbleEl.className='bubble';bubbleEl.textContent=text;document.body.appendChild(bubbleEl);
  bubbleObj=obj;bubbleOff.copy(off);bubbleT=2.6;placeBubble();
}
const _bp=new THREE.Vector3();
function placeBubble(){
  if(!bubbleEl)return;
  bubbleObj.getWorldPosition(_bp);_bp.add(bubbleOff).project(camera);
  const x=(_bp.x*.5+.5)*W,y=(-_bp.y*.5+.5)*H;
  const r=bubbleEl.getBoundingClientRect();
  const left=Math.min(Math.max(16,x-22),W-r.width-16),top=y-r.height-14;
  const pos=`translate(${left}px,${top}px)`;bubbleEl.style.setProperty('--pos',pos);bubbleEl.style.transform=pos;
}
function tap(x,y){
  ndc.set((x/W)*2-1,-(y/H)*2+1);ray.setFromCamera(ndc,camera);
  if(ray.intersectObject(cat,true).length){catAlert=3.2;catSwish=1.6;say(pick(['mrrp.','mrow?','...prrt.']),catHead,V(0,.22,0));return;}
  if(ray.intersectObject(hero,true).length){heroLook=4;heroWave=1.8;say(pick(heroLines[phaseEl.textContent]||['Hey.']),head,V(0,.32,0));return;}
  birdsScatter=1;birds.forEach(b=>b.vel.set(rnd(-1,1),rnd(.4,1.2),rnd(-1,1)).normalize().multiplyScalar(rnd(10,16)));
}

/* ---------- UI ---------- */
const clockEl=document.getElementById('clock'),phaseEl=document.getElementById('phase');
const slider=document.getElementById('tod'),playBtn=document.getElementById('play'),inkBtn=document.getElementById('ink');
let playing=false,dirPlay=1;
slider.addEventListener('input',()=>{tod=slider.value/1000;applyTime(tod);setPlaying(false);});
function setPlaying(p){playing=p;playBtn.setAttribute('aria-pressed',p);document.getElementById('playLabel').textContent=p?'Pause':'Play the day';
  document.getElementById('playIcon').setAttribute('d',p?'M3 2h3v10H3zM8 2h3v10H8z':'M3 1.5v11l9-5.5z');}
playBtn.addEventListener('click',()=>setPlaying(!playing));
inkBtn.addEventListener('click',()=>{const on=inkBtn.getAttribute('aria-pressed')!=='true';inkBtn.setAttribute('aria-pressed',on);postU.inkOn.value=on?1:0;});

/* ======================================================
   ANIMATION
   ====================================================== */
const clock=new THREE.Clock();
const tmpV=new THREE.Vector3(),tmpV2=new THREE.Vector3(),camLocal=new THREE.Vector3();
let shadowTick=0;
function animate(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // intro dolly
  if(intro<1){intro=Math.min(1,intro+dt/3.6);}
  const ie=1-Math.pow(1-intro,3);
  if(playing){tod+=dt*.035*dirPlay;if(tod>=1){tod=1;dirPlay=-1;}if(tod<=0){tod=0;dirPlay=1;}slider.value=Math.round(tod*1000);applyTime(tod);}

  // camera
  smx+=(mx-smx)*Math.min(1,dt*2.5);smy+=(my-smy)*Math.min(1,dt*2.5);
  yaw+=(tYaw-yaw)*Math.min(1,dt*4);pitch+=(tPitch-pitch)*Math.min(1,dt*4);zoom+=(tZoom-zoom)*Math.min(1,dt*4);
  const par=reduceMotion?.3:1;
  camera.position.set(camBase.x+smx*.45*par+(1-ie)*-1.2,camBase.y+smy*.22*par+(1-ie)*2.4,camBase.z+(1-ie)*6);
  tmpV.subVectors(lookBase,camBase);
  tmpV.applyAxisAngle(UP,yaw);
  const right=tmpV2.crossVectors(tmpV,UP).normalize();tmpV.applyAxisAngle(right,pitch+(1-ie)*-.12);
  camera.lookAt(tmpV.add(camera.position));
  camera.fov=baseFov+zoom;camera.updateProjectionMatrix();

  // hero pose
  const br=Math.sin(t*1.7)*.008;
  J.chest.set(.15,.64+br,0);J.neck.set(.2,.8+br,0);
  setLimb(torso,V(.02,.24,0),J.chest);chest.position.copy(J.chest);
  chestPanel.position.set(J.chest.x+.08,J.chest.y-.02,0);
  setLimb(neck,J.chest,J.neck);
  scarfRing.position.set(J.neck.x-.01,J.neck.y-.02,0);
  head.position.set(J.neck.x+.05,J.neck.y+.16,0);
  // head look: default toward city with idle glances; on tap, toward camera
  camLocal.copy(camera.position);hero.worldToLocal(camLocal);
  const toCam=Math.atan2(-(camLocal.z-head.position.z),camLocal.x-head.position.x);
  const idle=Math.sin(t*.23)*.25+Math.sin(t*.61)*.08-.15;
  heroLook=Math.max(0,heroLook-dt);
  const wantYaw=heroLook>0?THREE.MathUtils.clamp(toCam,-1.5,1.5):idle;
  head.rotation.y+=(wantYaw-head.rotation.y)*Math.min(1,dt*(heroLook>0?5:1.5));
  head.rotation.z+=((heroLook>0?.12:-.08+Math.sin(t*.4)*.04)-head.rotation.z)*Math.min(1,dt*3);
  for(const L of legs){
    setLimb(L.thigh,L.hip,L.knee);setLimb(L.shin,L.knee,L.ankle);L.kneeJ.position.copy(L.knee);
    L.boot.position.set(L.ankle.x+.06,.055,L.ankle.z);L.boot.rotation.y=-L.s*.08;
    setLimb(L.cuff,V(L.ankle.x,.06,L.ankle.z),V(L.ankle.x-.005,.15,L.ankle.z));
  }
  heroWave=Math.max(0,heroWave-dt);
  for(const A of arms){
    const S=V(A.shoulder.x,A.shoulder.y+br,A.shoulder.z);
    let Hd=A.hand.clone();
    if(A.s>0&&heroWave>0){const w=Math.sin(Math.min(1,(1.8-heroWave)/.35)*Math.PI/2)*Math.min(1,heroWave/.3);
      Hd.lerp(V(.42,1.0+Math.sin(t*14)*.04,.32+Math.sin(t*14)*.06),w);}
    else Hd.y+=Math.sin(t*1.7+A.s)*.006;
    const pole=V(.2,-.3,A.s*1.2);
    const {elbow,hand}=ik(S,Hd,.3,.3,pole);
    setLimb(A.upper,S,elbow);setLimb(A.fore,elbow,hand);
    A.sh.position.copy(S);A.el.position.copy(elbow);A.glove.position.copy(hand);
    const cuffA=elbow.clone().lerp(hand,.78);setLimb(A.cuff,cuffA,elbow.clone().lerp(hand,.9));
  }
  // scarf in the wind
  const ws=reduceMotion?.4:1;
  scarfPts[0].set(J.neck.x-.07,J.neck.y-.03,.04);
  for(let i=1;i<scarfPts.length;i++){
    const k=i/scarfPts.length;
    scarfPts[i].copy(scarfPts[i-1]).add(tmpV.set(-.065,.004+Math.sin(t*4.6*ws-i*.75)*.028*k+(-.03*(1-k)),.022+Math.sin(t*3.3*ws-i*.6)*.03*k));
  }
  for(let i=0;i<scarfSegs.length;i++){setLimb(scarfSegs[i],scarfPts[i],scarfPts[i+1]);scarfSegs[i].rotateY(Math.sin(t*3-i*.5)*.4);}

  // cat
  catAlert=Math.max(0,catAlert-dt);catSwish=Math.max(0,catSwish-dt);
  camLocal.copy(camera.position);cat.worldToLocal(camLocal);
  const catYaw=catAlert>0?THREE.MathUtils.clamp(Math.atan2(-camLocal.z,camLocal.x),-1,1):Math.sin(t*.3)*.5+.2;
  catHead.rotation.y+=(catYaw-catHead.rotation.y)*Math.min(1,dt*3);
  catHead.rotation.z=Math.sin(t*.5)*.05+(catAlert>0?.12:0);
  const twitch=Math.max(0,Math.sin(t*1.3)-.94)*6;
  catEars.forEach((e,i)=>e.rotation.x=(i?1:-1)*(.35+twitch*.4));
  {let p=V(-.17,.04,-.02),ang=Math.PI*1.15;const sw=catSwish>0?2.6:1;
    for(let i=0;i<tailSegs.length;i++){
      ang+=.16+Math.sin(t*1.4*sw-i*.6)*.12*sw*(i/tailSegs.length+.2);
      const n=p.clone().add(V(Math.cos(ang)*.055,i<2?.0:.004*Math.sin(t+i),Math.sin(ang)*.055));
      setLimbIn(tailSegs[i],p,n);p=n;}
  }

  // birds
  birdsScatter=Math.max(0,birdsScatter-dt*.18);
  for(const b of birds){
    b.a+=b.sp*dt*(1+birdsScatter*2);
    b.off.addScaledVector(b.vel,dt);b.vel.multiplyScalar(1-dt*.7);b.off.multiplyScalar(1-dt*.25*(1-birdsScatter));
    const x=flockCenter.x+Math.cos(b.a)*b.r,z=flockCenter.z+Math.sin(b.a)*b.r*.6,y=flockCenter.y+b.h*.4+Math.sin(t*.7+b.ph)*.6;
    b.g.position.set(x,y,z).add(b.off);
    b.g.rotation.y=-b.a-Math.PI/2*Math.sign(b.sp);
    const f=Math.sin(t*(12+birdsScatter*8)+b.ph)*.9;b.wl.rotation.x=f;b.wr.rotation.x=-f;
  }
  // dust
  if(state.dust>0.01){const a=dustGeo.attributes.position.array;
    for(let i=0;i<dustN;i++){const s=dustSeed[i];a[i*3]+=Math.sin(t*.3+s)*.002+.0016;a[i*3+1]+=Math.cos(t*.25+s*1.3)*.0016+.0006;
      if(a[i*3]>9)a[i*3]=-4;if(a[i*3+1]>5.5)a[i*3+1]=-1;}
    dustGeo.attributes.position.needsUpdate=true;}

  skyU.time.value=t;postU.time.value=t;postU.night.value=state.night;postU.grade.value.copy(state.grade);

  // bubble
  if(bubbleEl){bubbleT-=dt;placeBubble();if(bubbleT<0){bubbleEl.remove();bubbleEl=null;}}

  // render passes
  if((shadowTick++&1)===0)renderer.shadowMap.needsUpdate=true;
  renderer.setRenderTarget(rtColor);renderer.render(scene,camera);
  sky.visible=false;dust.visible=false;scene.overrideMaterial=normalMat;
  const bg=scene.background;renderer.setClearColor(0x8080ff,1);
  renderer.setRenderTarget(rtNormal);renderer.render(scene,camera);
  scene.overrideMaterial=null;sky.visible=true;dust.visible=true;renderer.setClearColor(0x000000,1);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  requestAnimationFrame(animate);
}

resize();applyTime(tod);
requestAnimationFrame(()=>document.getElementById('panel').classList.remove('pre'));
animate();
})();
