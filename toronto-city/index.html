<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Toronto Skyline VR — Walkable Financial District</title>
<meta name="description" content="A walkable, WebXR-ready recreation of downtown Toronto's financial district skyline, built with Three.js."/>
<style>
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; background:#060a10; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#eef2f7;}
#app{position:fixed; inset:0;}
canvas{display:block; touch-action:none;}

#hud{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:flex-start; padding:20px 24px; pointer-events:none;}
#hud .brand{font-weight:700; font-size:14px; letter-spacing:.06em;}
#hud .brand span{color:#8fb4ff;}
#hud .hint{font-size:11px; opacity:.6; margin-top:4px; max-width:260px; line-height:1.5;}

#vrbtn{position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:30; background:#13203a; border:1px solid rgba(143,180,255,.4); color:#eef2f7; font-size:13px; font-weight:600; letter-spacing:.04em; padding:14px 26px; border-radius:30px; cursor:pointer; display:flex; align-items:center; gap:10px; backdrop-filter:blur(8px);}
#vrbtn:hover{background:#1b2c4e;}
#vrbtn .dot{width:8px; height:8px; border-radius:50%; background:#5ad17c; box-shadow:0 0 8px #5ad17c;}
#vrbtn[disabled]{opacity:.5; cursor:not-allowed;}

#diag{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); z-index:30; background:rgba(20,10,10,.85); border:1px solid rgba(255,120,120,.4); color:#ffd8d8; font-size:11.5px; padding:10px 16px; border-radius:10px; max-width:340px; text-align:center; display:none; line-height:1.5;}

#loading{position:fixed; inset:0; z-index:40; background:#060a10; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;}
#loading .ring{width:40px; height:40px; border-radius:50%; border:2px solid rgba(143,180,255,.2); border-top-color:#8fb4ff; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:12px; letter-spacing:.08em; opacity:.6; text-transform:uppercase;}

#deskhelp{position:fixed; bottom:28px; right:24px; z-index:20; font-size:11px; opacity:.55; text-align:right; line-height:1.6; pointer-events:none;}
@media(max-width:760px){ #deskhelp{display:none} #hud .hint{max-width:180px;} }

#crosshair{position:fixed; top:50%; left:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:rgba(255,255,255,.5); z-index:15; pointer-events:none; display:none;}
body.pointerlocked #crosshair{display:block;}
</style>
</head>
<body>
<div id="app"></div>

<div id="loading"><div class="ring"></div><p>Building skyline…</p></div>

<div id="hud">
  <div>
    <div class="brand">TORONTO <span>SKYLINE VR</span></div>
    <div class="hint">Financial District, walkable — real building footprints &amp; heights, procedural glass/stone facades.</div>
  </div>
</div>

<div id="crosshair"></div>
<div id="deskhelp">Click to look around · WASD / arrows to walk · Shift to run · Esc to release</div>
<div id="diag"></div>
<button id="vrbtn" disabled><span class="dot"></span>Checking VR…</button>
