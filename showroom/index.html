<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom — Rohit Kumar</title>
<meta name="description" content="A cinematic 3D showroom by Rohit Kumar. Turn real PBR objects, switch finishes live, measure them, and place them in your room on Meta Quest 3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed stage. Copy column bottom-left, spec card right, navigation bottom-right, actions top-right; callouts float over the object. */
:root{
  --ink:#f4efe7; --dim:rgba(244,239,231,.62); --faint:rgba(244,239,231,.15); --glass:rgba(18,15,13,.5);
  --brass:#d6a46a; --brass-ink:#1c1208; --bg1:#2a2420; --bg2:#12100e; --bg3:#0b0a09;
  --f-display:"Bodoni Moda", Didot, Georgia, serif; --f-body:"Manrope","Helvetica Neue",ui-sans-serif,sans-serif;
  --gx:max(24px, env(safe-area-inset-left, 0px)); --gr:max(24px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
body.light{--ink:#1c1915; --dim:rgba(28,25,21,.62); --faint:rgba(28,25,21,.16); --glass:rgba(250,247,242,.55)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;padding-left:var(--gx);padding-right:var(--gr);
  background:radial-gradient(120% 90% at 58% 38%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);transition:background 1.4s, color .8s}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
/* film finish */
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 100% at 58% 45%, transparent 55%, rgba(0,0,0,.42) 100%)}
body.light .vig{background:radial-gradient(120% 100% at 58% 45%, transparent 60%, rgba(60,50,40,.18) 100%)}

.top{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:var(--gx);right:var(--gr);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:6}
.brand{display:flex;gap:16px;align-items:baseline}
.brand b{font:400 22px/1 var(--f-display);letter-spacing:.3em}
.brand a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:2px}
.brand a:hover{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:700 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:13px 18px;border-radius:999px;border:1px solid var(--faint);background:var(--glass);color:var(--ink);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn:focus-visible,.sw:focus-visible,.nav button:focus-visible,.tog:focus-visible,#moods button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.copy{position:fixed;left:var(--gx);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 48px));z-index:5;display:grid;gap:14px}
.num{font:400 15px/1 var(--f-display);letter-spacing:.1em;color:var(--brass);display:flex;gap:10px;align-items:center;font-variant-numeric:lining-nums tabular-nums}
.num::after{content:"";width:48px;height:1px;background:var(--brass);opacity:.6}
#kind{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#name{margin:0;font:400 clamp(40px,5.6vw,80px)/.95 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
#name .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
#name .c{display:inline-block}
#blurb{margin:0;color:var(--dim);font-size:15px;line-height:1.6;max-width:44ch}
#swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--faint);background:var(--glass);color:var(--dim);font:600 12px/1 var(--f-body);cursor:pointer;transition:border-color .3s,color .3s;backdrop-filter:blur(10px)}
.sw i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw.on{color:var(--ink);border-color:var(--brass)}
.none{font-size:12px;color:var(--dim);letter-spacing:.06em}
#credit{font-size:11px;color:var(--dim);opacity:.7;line-height:1.5}

/* spec card */
#spec{position:fixed;right:var(--gr);top:calc(96px + env(safe-area-inset-top,0px));width:250px;z-index:5;padding:20px;border-radius:18px;border:1px solid var(--faint);background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);display:grid;gap:16px}
.lbl{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dims .row{display:grid;gap:4px}
.dims b{font:400 30px/1 var(--f-display);font-variant-numeric:lining-nums tabular-nums}
.dims span{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.fin{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--faint);padding-top:14px}
#finish{font:italic 400 20px/1 var(--f-display)}
#mats{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:12px;color:var(--dim)}
#mats li{display:flex;gap:10px;align-items:center}
#mats li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brass)}
.togs{display:flex;gap:6px;border-top:1px solid var(--faint);padding-top:14px}
.tog{flex:1;font:700 10px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:11px 8px;border-radius:999px;border:1px solid var(--faint);background:none;color:var(--dim);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
#moods{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--faint)}
#moods button{flex:1;font:600 11px/1 var(--f-body);letter-spacing:.06em;padding:9px 6px;border:0;border-radius:999px;background:none;color:var(--dim);cursor:pointer}
#moods button.on{background:var(--ink);color:var(--bg3)}

.nav{position:fixed;right:var(--gr);bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;gap:14px;justify-items:end}
.arrows{display:flex;gap:8px}
.arrows button{width:56px;height:56px;border-radius:50%;border:1px solid var(--faint);background:var(--glass);color:var(--ink);font:400 20px/1 var(--f-body);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .3s}
.arrows button:hover{border-color:var(--brass)}
#dots{display:flex;gap:6px}
#dots button{width:26px;height:3px;border:0;border-radius:2px;background:var(--faint);cursor:pointer;padding:0;transition:background .3s,width .4s}
#dots button.on{background:var(--brass);width:46px}
.hint{font-size:11px;color:var(--dim);letter-spacing:.06em}

/* callouts */
#notes{position:fixed;inset:0;pointer-events:none;z-index:4}
body.notes-off #notes{display:none}
.note2{position:absolute;left:0;top:0;will-change:transform,opacity}
.note2 .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#f4d2a6;box-shadow:0 0 0 4px rgba(214,164,106,.25),0 0 18px rgba(214,164,106,.8)}
.note2 .dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(214,164,106,.7);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.note2 .ln{position:absolute;left:0;top:0;overflow:visible}
.note2 .ln line{stroke:var(--brass);stroke-width:1}
.note2 .lab{position:absolute;left:0;top:0;width:max-content;max-width:220px;padding:10px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--faint);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;gap:3px}
.note2 .lab.l{text-align:right}
.note2 b{font:700 10px/1 var(--f-body);letter-spacing:.2em;color:var(--brass)}
.note2 strong{font:400 17px/1.15 var(--f-display);font-weight:400}
.note2 em{font-style:normal;font-size:11px;color:var(--dim);line-height:1.4}
body.loading #stage{cursor:progress}
.note{position:fixed;left:0;right:0;margin-inline:auto;top:42%;width:min(420px,calc(100vw - 48px));padding:16px;z-index:20;font-size:13px;line-height:1.5;background:var(--glass);border:1px solid var(--faint);border-radius:14px;backdrop-filter:blur(14px)}

.pre{position:fixed;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:22px;background:#0b0a09;color:#f4efe7}
.pre .w{font:400 clamp(44px,10vw,124px)/1 var(--f-display);letter-spacing:.24em;padding-left:.24em;display:flex;overflow:hidden}
.pre .w .w,.pre .w .c{display:inline-block}
.pre .row{display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.3em;color:rgba(244,239,231,.6)}
#bar{width:min(300px,56vw);height:1px;background:rgba(244,239,231,.15);position:relative;overflow:hidden}
#bar i{position:absolute;inset:0;background:var(--brass);transform-origin:left;transform:scaleX(0)}
#pct{font-variant-numeric:tabular-nums}

@media (max-width:1100px){ #spec{width:220px} .dims b{font-size:24px} }
@media (max-width:900px){
  #spec{top:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));right:var(--gr);width:auto;left:auto;padding:12px;gap:10px}
  #spec .dims,#spec #mats,#spec .fin,#spec .lbl{display:none}
  .copy{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
  #blurb,#credit{display:none}
  .nav{left:var(--gx);right:var(--gr);justify-items:stretch;grid-template-columns:1fr auto;align-items:center}
  .hint{display:none}
  .brand a{display:none}
  .note2 .lab{max-width:150px}
  .note2 em{display:none}
}
@media (prefers-reduced-motion:reduce){ .grain{animation:none} .note2 .dot::after{animation:none} }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="3D object stage. Drag to turn."></canvas>
<div id="notes" aria-hidden="true"></div>
<div class="vig"></div><div class="grain"></div>

<header class="top ui">
  <div class="brand"><b>SHOWROOM</b><a href="../">← Portfolio 360</a></div>
  <div class="acts"><button class="btn gold" id="ar">View in your room</button><button class="btn" id="vr">Enter VR</button></div>
</header>

<aside id="spec" class="ui" aria-label="Specification">
  <div class="lbl">Dimensions · cm</div>
  <div class="dims"><div class="row"><b id="dW">—</b><span>WIDTH</span></div><div class="row"><b id="dD">—</b><span>DEPTH</span></div><div class="row"><b id="dH">—</b><span>HEIGHT</span></div></div>
  <div class="fin"><span class="lbl">Finish</span><span id="finish">—</span></div>
  <ul id="mats"></ul>
  <div class="togs"><button class="tog" id="tNotes" aria-pressed="true">Details</button><button class="tog" id="tMeasure" aria-pressed="false">Measure</button></div>
  <div id="moods" role="group" aria-label="Lighting"></div>
</aside>

<section class="copy ui" aria-live="polite">
  <div class="num"><span id="idx">01</span><span>/ 04</span></div>
  <div id="kind"></div>
  <h1 id="name"></h1>
  <p id="blurb"></p>
  <div id="swatches" role="group" aria-label="Finishes"></div>
  <div id="credit"></div>
</section>

<nav class="nav ui" aria-label="Pieces">
  <div class="hint">Drag to turn · scroll to zoom · ↑ ↓ finishes · M measure</div>
  <div id="dots"></div>
  <div class="arrows"><button id="prev" aria-label="Previous piece">←</button><button id="next" aria-label="Next piece">→</button></div>
</nav>
<div class="note" id="note" hidden></div>

<div class="pre" id="pre">
  <div class="w" id="preW"></div>
  <div class="row"><span>LOADING REAL MATERIALS</span><div id="bar"><i></i></div><span id="pct">000</span></div>
</div>
