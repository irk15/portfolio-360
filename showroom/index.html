<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom — Rohit Kumar</title>
<meta name="description" content="A cinematic 3D showroom by Rohit Kumar. Turn real PBR objects, switch their finishes live, and place them in your room on Meta Quest 3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed studio stage; copy column bottom-left, navigation bottom-right, actions top-right. Single dark-studio look. */
:root{
  --ink:#f4efe7; --dim:rgba(244,239,231,.6); --faint:rgba(244,239,231,.15); --glass:rgba(18,15,13,.5);
  --brass:#d6a46a; --brass-ink:#1c1208; --ground:#0b0a09;
  --f-display:"Bodoni Moda", Didot, Georgia, serif; --f-body:"Manrope","Helvetica Neue",ui-sans-serif,sans-serif;
  --gx:max(20px, env(safe-area-inset-left, 0px)); --gr:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;padding-left:var(--gx);padding-right:var(--gr);
  background:radial-gradient(120% 90% at 50% 38%, #2a2420 0%, #12100e 55%, #0b0a09 100%)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
.top{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:var(--gx);right:var(--gr);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.brand{display:flex;gap:14px;align-items:baseline}
.brand b{font:400 22px/1 var(--f-display);letter-spacing:.3em}
.brand a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:2px}
.brand a:hover{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:700 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:13px 18px;border-radius:999px;border:1px solid var(--faint);background:var(--glass);color:var(--ink);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn:focus-visible,.sw:focus-visible,.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.copy{position:fixed;left:var(--gx);bottom:calc(28px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 40px));z-index:4;display:grid;gap:14px}
.num{font:400 15px/1 var(--f-display);letter-spacing:.1em;color:var(--brass);display:flex;gap:10px;align-items:center;font-variant-numeric:lining-nums tabular-nums}
.num::after{content:"";width:48px;height:1px;background:var(--brass);opacity:.6}
#kind{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#name{margin:0;font:400 clamp(40px,6.2vw,84px)/.95 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
#name .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
#name .c{display:inline-block}
#blurb{margin:0;color:var(--dim);font-size:15px;line-height:1.6;max-width:44ch}
#swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--faint);background:var(--glass);color:var(--dim);font:600 12px/1 var(--f-body);cursor:pointer;transition:border-color .3s,color .3s}
.sw i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw.on{color:var(--ink);border-color:var(--brass)}
.none{font-size:12px;color:var(--dim);letter-spacing:.06em}
#credit{font-size:11px;color:rgba(244,239,231,.42);line-height:1.5}

.nav{position:fixed;right:var(--gr);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:14px;justify-items:end}
.arrows{display:flex;gap:8px}
.arrows button{width:54px;height:54px;border-radius:50%;border:1px solid var(--faint);background:var(--glass);color:var(--ink);font:400 20px/1 var(--f-body);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.arrows button:hover{border-color:var(--brass)}
#dots{display:flex;gap:6px}
#dots button{width:26px;height:3px;border:0;border-radius:2px;background:var(--faint);cursor:pointer;padding:0;transition:background .3s,width .3s}
#dots button.on{background:var(--brass);width:46px}
.hint{font-size:11px;color:var(--dim);letter-spacing:.06em}
body.loading #stage{cursor:progress}
.note{position:fixed;left:0;right:0;margin-inline:auto;top:42%;width:min(420px,calc(100vw - 40px));padding:16px;z-index:20;font-size:13px;line-height:1.5;background:var(--glass);border:1px solid var(--faint);border-radius:14px;backdrop-filter:blur(14px)}

.pre{position:fixed;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:20px;background:#0b0a09}
.pre .w{font:400 clamp(44px,10vw,124px)/1 var(--f-display);letter-spacing:.24em;padding-left:.24em;display:flex;overflow:hidden}
.pre .w .w,.pre .w .c{display:inline-block}
.pre .row{display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.3em;color:var(--dim)}
#bar{width:min(300px,64vw);height:1px;background:var(--faint);position:relative;overflow:hidden}
#bar i{position:absolute;inset:0;background:var(--brass);transform-origin:left;transform:scaleX(0)}
#pct{font-variant-numeric:tabular-nums}

@media (max-width:760px){
  .copy{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  #blurb,#credit{display:none}
  .nav{left:var(--gx);right:var(--gr);justify-items:stretch;grid-template-columns:1fr auto;align-items:center}
  .hint{display:none}
  .brand a{display:none}
}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="3D object stage. Drag to turn."></canvas>

<header class="top ui">
  <div class="brand"><b>SHOWROOM</b><a href="../">← Portfolio 360</a></div>
  <div class="acts"><button class="btn gold" id="ar">View in your room</button><button class="btn" id="vr">Enter VR</button></div>
</header>

<section class="copy ui" aria-live="polite">
  <div class="num"><span id="idx">01</span><span>/ 04</span></div>
  <div id="kind"></div>
  <h1 id="name"></h1>
  <p id="blurb"></p>
  <div id="swatches" role="group" aria-label="Finishes"></div>
  <div id="credit"></div>
</section>

<nav class="nav ui" aria-label="Pieces">
  <div class="hint">Drag to turn · scroll to zoom · ↑ ↓ finishes</div>
  <div id="dots"></div>
  <div class="arrows"><button id="prev" aria-label="Previous piece">←</button><button id="next" aria-label="Next piece">→</button></div>
</nav>
<div class="note" id="note" hidden></div>

<div class="pre" id="pre">
  <div class="w" id="preW"></div>
  <div class="row"><span>LOADING REAL MATERIALS</span><div id="bar"><i></i></div><span id="pct">000</span></div>
</div>
